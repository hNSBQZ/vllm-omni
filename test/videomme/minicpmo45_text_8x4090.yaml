# Text-only MiniCPM-o-4.5 config for Video-MME evaluation.
# Derived from vllm_omni/model_executor/stage_configs/minicpmo45_8x4090.yaml
# stage 0. The full YAML also initializes TTS/T2W stages, which are unnecessary
# for multiple-choice text evaluation.

stage_args:
  - stage_id: 0
    runtime:
      process: true
      devices: "0,1,2,3,4,5,6,7"
      max_batch_size: 1
    engine_args:
      model_stage: llm
      model_arch: MiniCPMO45OmniForConditionalGeneration
      worker_cls: vllm_omni.worker.gpu_ar_worker.GPUARWorker
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      gpu_memory_utilization: 0.35
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: text
      enable_prefix_caching: false
      max_model_len: 40960
      max_num_batched_tokens: 16384
      max_num_seqs: 1
      tensor_parallel_size: 8
      limit_mm_per_prompt:
        video: 1

    is_comprehension: true
    final_output: true
    final_output_type: text
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      detokenize: true
      repetition_penalty: 1.1
